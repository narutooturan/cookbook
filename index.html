", "body": "为了减少调料使用，将有风味的食材与风味较淡的食材搭配，利用天然酸甜、鲜味和香气建立层次。"}, {"title": "香味食材", "body": "生姜、大蒜、洋葱、大葱、小葱；八角、桂皮、香叶、豆蔻。"}, {"title": "酸甜食材", "body": "番茄。"}, {"title": "鲜味食材", "body": "菌类、海鲜干货、白萝卜、包心菜、白菜。"}, {"title": "白菜馅注意", "body": "白菜容易出水，可能导致馅料偏稀；需控制水分。"}, {"title": "孜然牛肉", "body": "个人经验：加糖是关键。"}, {"title": "卤味", "body": "牛腱子高压锅约25分钟；鸭舌不适合与牛肉一起卤，建议分开处理。"}, {"title": "猪肚", "body": "高压锅约20分钟，来自个人烹饪记录。"}, {"title": "梅干菜肉麦饼", "body": "饼皮面粉250g、水225g，冷藏一晚；梅干菜肉馅猪肉500g、梅干菜160g、盐0–2g；纯肉馅猪肉500g、盐5g。"}]};const recipes=DATA.recipes.map((r,i)=>({...r,id:i}));const categories=[...new Set(recipes.map(r=>r.category||'其他'))];let page='all',category='全部',query='';const $=s=>document.querySelector(s);const escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};let favorites=read('family_recipe_favs'),order=read('family_recipe_order');const save=()=>{try{localStorage.setItem('family_recipe_favs',JSON.stringify(favorites));localStorage.setItem('family_recipe_order',JSON.stringify(order))}catch{}};function toggle(kind,id){let a=kind==='fav'?favorites:order;const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render();if($('#overlay').classList.contains('show'))openDetail(id)}function choose(p,c='全部'){page=p;category=c;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){const tabs=[['all','全部菜谱'],['favorites','我的收藏'],['order','今日点菜'],['tips','烹饪心得']];$('#nav').innerHTML=tabs.map(([p,t])=>`<button class="nav ${page===p?'active':''}" data-page="${p}"><span>${t}</span><span>${p==='all'?recipes.length:p==='favorites'?favorites.length:p==='order'?order.length:'✦'}</span></button>`).join('')+'<div class="side-label">菜谱分类 · CATEGORIES</div>'+categories.map(c=>`<button class="nav ${page==='category'&&category===c?'active':''}" data-category="${escapeHTML(c)}"><span>${escapeHTML(c)}</span><span>${recipes.filter(r=>r.category===c).length}</span></button>`).join('');$('#chips').innerHTML=['全部',...categories].map(c=>`<button class="chip ${((page==='all'&&c==='全部')||(page==='category'&&category===c))?'active':''}" data-category="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('');$('#total').textContent=`收录 ${recipes.length} 道家常味道`;$('#orderCount').textContent=order.length;$('#orderBtn').classList.toggle('selected',page==='order');document.querySelectorAll('.bottomnav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const title=page==='all'?'全部菜谱':page==='category'?category:page==='favorites'?'我的收藏':page==='order'?'今日点菜':'厨房小心得';$('#heading').textContent=title;let items=recipes.filter(r=>(page==='category'?r.category===category:page==='favorites'?favorites.includes(r.id):page==='order'?order.includes(r.id):true));if(query)items=items.filter(r=>[r.name,r.ingredients,r.seasoning,r.category].join(' ').toLowerCase().includes(query.toLowerCase()));$('#count').textContent=page==='tips'?`${DATA.tips.length} 条记录`:`共 ${items.length} 道`;if(page==='tips'){$('#content').innerHTML=DATA.tips.map(t=>`<div class="tipcard"><h3>${escapeHTML(t.title)}</h3><p>${escapeHTML(t.body)}</p></div>`).join('');return}$('#content').innerHTML=items.length?`<div class="cards">${items.map((r,i)=>`<article class="recipe" data-id="${r.id}" tabindex="0" role="button" aria-label="查看${escapeHTML(r.name)}"><span class="num">NO. ${String(i+1).padStart(3,'0')}</span><h3>${escapeHTML(r.name)}</h3><div class="desc">${escapeHTML((r.ingredients&&String(r.ingredients).trim())||'--')}</div><div class="cardbottom"><span class="tag">${escapeHTML(r.category||'其他')}</span><button class="heart ${favorites.includes(r.id)?'on':''}" data-fav="${r.id}" aria-label="收藏">${favorites.includes(r.id)?'♥':'♡'}</button></div></article>`).join('')}</div>`:`<div class="empty">这里还空着呢。<br>换个分类，或挑一道喜欢的菜吧。</div>`}function section(title,value){return `<section><h4>${title}</h4><div class="body ${value?'':'placeholder'}">${escapeHTML(value||'这部分还没有记录，留待家人慢慢补充。')}</div></section>`}function openDetail(id){const r=recipes[id];if(!r)return;$('#detailBody').innerHTML=`<div class="detailtop"><span class="eyebrow">${escapeHTML(r.category)} · 家庭菜谱</span><button class="close" id="closeDetail" aria-label="关闭">×</button></div><h2 id="detailTitle">${escapeHTML(r.name)}</h2>${section('主要食材',r.ingredients||'--')}${section('调味料',r.seasoning)}${section('做法',r.steps)}${r.tips?section('烹饪心得',r.tips):''}${r.note?section('备注',r.note):''}<div class="detailactions"><button class="action ${order.includes(id)?'selected':''}" data-order="${id}">${order.includes(id)?'✓ 已加入今日点菜':'＋ 加入今日点菜'}</button><button class="action" data-fav="${id}">${favorites.includes(id)?'♥ 已收藏':'♡ 收藏菜谱'}</button></div>`;$('#overlay').classList.add('show');document.body.style.overflow='hidden';$('#closeDetail').onclick=closeDetail}function closeDetail(){$('#overlay').classList.remove('show');document.body.style.overflow=''}document.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){e.stopPropagation();toggle('fav',Number(f.dataset.fav));return}const o=e.target.closest('[data-order]');if(o){toggle('order',Number(o.dataset.order));return}const c=e.target.closest('[data-category]');if(c){choose(c.dataset.category==='全部'?'all':'category',c.dataset.category);return}const p=e.target.closest('[data-page]');if(p){choose(p.dataset.page);return}const r=e.target.closest('[data-id]');if(r)openDetail(Number(r.dataset.id))});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.recipe')){e.preventDefault();openDetail(Number(e.target.dataset.id))}});$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDetail()});$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});$('#orderBtn').onclick=()=>choose('order');render();
</script></body></html>
