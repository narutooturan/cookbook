name: Cookbook V2 tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify seasonal ingredient and meal planner rules
        run: node --test tests/cookbook-v2.test.cjs
